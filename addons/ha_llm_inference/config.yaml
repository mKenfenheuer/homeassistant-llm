name: HA LLM Inference
version: "0.12.0"
slug: ha_llm_inference
description: llama.cpp server with the Home Assistant language model, on the GPU (NVIDIA, AMD, Intel) or the CPU
arch:
  - amd64
  - aarch64
startup: services
boot: auto
ports:
  8080/tcp: null
ports_description:
  8080/tcp: OpenAI-compatible API (only needed outside Home Assistant)
map:
  - type: share
    read_only: false
watchdog: http://[HOST]:[PORT:8080]/health
# only used to post a notification if the CPU has no AVX2
homeassistant_api: true
# GPU access: /dev/dri everywhere; on Home Assistant OS with GPU support
# also /dev/kfd and the NVIDIA devices and libraries through CDI.
# Without a GPU llama.cpp runs on the CPU.
video: true
options:
  language: de
  auto_update: true
  update_interval: 6
  model_url: ""
  model_sha256: ""
  model_path: ""
  hf_token: ""
  ctx_size: 8192
  threads: 0
  gpu_layers: 99
  gpu_memory: 0
  extra_args: ""
schema:
  language: list(de)
  auto_update: bool
  update_interval: int(1,168)
  model_url: str?
  model_sha256: str?
  model_path: str?
  hf_token: password?
  ctx_size: int(2048,32768)
  threads: int(0,128)
  gpu_layers: int(0,999)
  gpu_memory: int(0,262144)
  extra_args: str?
