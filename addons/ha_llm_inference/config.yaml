name: HA LLM Inference
version: "0.3.1"
slug: ha_llm_inference
description: llama.cpp-Server (CPU) für das deutsche Home-Assistant-Sprachmodell
arch:
  - amd64
  - aarch64
startup: services
boot: auto
ports:
  8080/tcp: null
ports_description:
  8080/tcp: OpenAI-kompatible API (nur für Zugriff außerhalb von Home Assistant)
map:
