configuration:
  model_url:
    name: Model URL
    description: Download URL of the GGUF file (Hugging Face). Downloaded to /share/ha_llm/ on first start.
  model_sha256:
    name: Model SHA-256
    description: Checksum of the GGUF file. Leave empty to skip the check.
  model_path:
    name: Local model file
    description: Optional. Own path to a GGUF file, e.g. /share/ha_llm/custom.gguf. Empty = file name from the URL.
  hf_token:
    name: Hugging Face token
    description: Only needed for private Hugging Face repositories.
  ctx_size:
    name: Context size
    description: Tokens per request. 8192 covers about 250 entities.
  threads:
    name: CPU threads
    description: 0 = automatic
  extra_args:
    name: Extra arguments
    description: Additional llama-server parameters, e.g. --mlock
network:
  8080/tcp: OpenAI-compatible API (only needed outside Home Assistant)
