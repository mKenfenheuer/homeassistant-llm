configuration:
  language:
    name: Language
    description: "Language of the model. The app downloads the model of this language. Available today: German (de)."
  auto_update:
    name: Update model automatically
    description: Downloads new models from Hugging Face as soon as they are published. Only applies if model URL and local model file are empty.
  update_interval:
    name: Check interval (hours)
    description: How often the add-on looks for a new model. It also checks on every start.
  model_url:
    name: Model URL
    description: Optional. Empty = the official model from Hugging Face. Custom GGUF URL possible.
  model_sha256:
    name: Model SHA-256
    description: Optional. Checksum of a custom model_url.
  model_path:
    name: Local model file
    description: Optional. Own path to a GGUF file, e.g. /share/ha_llm/custom.gguf. Empty = file name from the URL.
  hf_token:
    name: Hugging Face token
    description: Only needed for private Hugging Face repositories.
  ctx_size:
    name: Context size
    description: Tokens per request. 8192 covers about 250 entities.
  threads:
    name: CPU threads
    description: 0 = automatic
  gpu_layers:
    name: GPU layers
    description: Number of model layers on the GPU. 99 = all, 0 = CPU only.
  gpu_memory:
    name: GPU memory budget (MiB)
    description: "0 = no limit. Otherwise the app keeps at most this much GPU memory and puts the remaining layers on the CPU. Replaces GPU layers. The model needs about 2300 MiB."
  extra_args:
    name: Extra arguments
    description: Additional llama-server parameters, e.g. --mlock
network:
  8080/tcp: OpenAI-compatible API (only needed outside Home Assistant)
