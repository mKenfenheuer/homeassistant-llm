configuration:
  auto_update:
    name: Modell automatisch aktualisieren
    description: Lädt neue Modelle von Hugging Face, sobald sie erscheinen. Gilt nur, wenn Modell-URL und lokale Modelldatei leer sind.
  update_interval:
    name: Prüfintervall (Stunden)
    description: Wie oft das Add-on nach einem neuen Modell sucht. Zusätzlich prüft es bei jedem Start.
  model_url:
    name: Modell-URL
    description: Optional. Leer = das offizielle Modell von Hugging Face. Eigene URL einer GGUF-Datei möglich.
  model_sha256:
    name: SHA-256 des Modells
    description: Optional. Prüfsumme einer eigenen model_url.
  model_path:
    name: Lokale Modelldatei
    description: Optional. Eigener Pfad zu einer GGUF-Datei, z. B. /share/ha_llm/eigenes.gguf. Leer = Dateiname aus der URL.
  hf_token:
    name: Hugging-Face-Token
    description: Nur für private Hugging-Face-Repositories nötig.
  ctx_size:
    name: Kontextlänge
    description: Tokens pro Anfrage. 8192 reicht für etwa 250 Entitäten.
  threads:
    name: CPU-Threads
    description: 0 = automatisch
  gpu_layers:
    name: GPU-Schichten
    description: Anzahl der Modellschichten auf der GPU. 99 = alle, 0 = nur CPU.
  extra_args:
    name: Zusätzliche Argumente
    description: Weitere llama-server-Parameter, z. B. --mlock
network:
  8080/tcp: OpenAI-kompatible API (nur für Zugriff außerhalb von Home Assistant)
